name: Refresh weather snapshot

on:
  schedule:
    - cron: "12 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weather-snapshot
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Download and validate Chenggong weather
        run: node scripts/update-weather-snapshot.mjs

      - name: Publish snapshot when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/weather.json
          if git diff --cached --quiet; then
            echo "Weather snapshot is unchanged."
            exit 0
          fi
          git commit -m "data: refresh weather snapshot"
          git push
